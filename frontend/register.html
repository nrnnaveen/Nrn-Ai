<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — NRN AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/favicon.svg" alt="NRN AI Logo" class="auth-logo">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Get your own private assistant workspace</p>
      </div>

      <div id="auth-banner" class="auth-error-banner" role="alert"></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            autocomplete="username"
            required
            autofocus
            placeholder="e.g. alex"
          >
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            autocomplete="email"
            required
            placeholder="alex@example.com"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="new-password"
              required
              placeholder="8+ chars, upper, lower, number, symbol"
            >
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="password-strength-bar">
            <div class="password-strength-fill" id="strength-fill"></div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width: 100%; margin-top: var(--sp-2);">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer-links">
        Already have an account? <a href="/login" class="auth-link">Sign in</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
