<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — NRN AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/favicon.svg" alt="NRN AI Logo" class="auth-logo">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your private AI workspace</p>
      </div>

      <div id="auth-banner" class="auth-error-banner" role="alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login" class="form-label">Email or Username</label>
          <input
            type="text"
            id="login"
            name="login"
            class="form-input"
            autocomplete="username"
            required
            autofocus
            placeholder="username or email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            >
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: var(--sp-2);">
          <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer-links">
        Don't have an account? <a href="/register" class="auth-link">Create one</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
