<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — NRN AI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/favicon.svg" alt="NRN AI Monogram" class="auth-brand-logo">
        <span class="auth-brand-name">NRN AI</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to your private workspace</p>

      <div id="auth-banner" class="auth-banner" role="alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login" class="form-label">Email or Username</label>
          <input
            type="text"
            id="login"
            name="login"
            class="form-input"
            autocomplete="username"
            required
            autofocus
            placeholder="name@example.com or username"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            autocomplete="current-password"
            required
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--sp-2);">
          Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create one</a>
      </div>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
